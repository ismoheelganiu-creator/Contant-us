<!DOCTYPE html>
<html lang="en">

    <title>School Register Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student register form</h1>
    <h2>STUDENT CLASS REGISTER</h2>
</header>

<div class="container">
    <h2>Class Attendance Register</h2>

    <label>Class:</label>
    <input type="text" placeholder="Enter class">

    <input type="text" placeholder="Enter Number ">

    <label>Teacher's Name:</label>

    <label>Date of Birth:</label>
    <input type="text" placeholder="Enter date of birth">

    <table>
        <tr>
            <th>S/N</th>
            <th>Student Name</th>
            <th>Gender</th>
            <th>Present</th>
            <th>Absent</th>
        </tr>

        <tr>

            <td>2</td>

            <td>Female</td>
            <td><input type="checkbox"></td>

        </tr>

        <tr>
            <td>3</td>
            <td>jss 3</td>

            <td><input type="checkbox"></td>

        </tr>
        <tr>

            <td>male</td>

            <td><input type="checkbox"></td>
        </tr>
        <tr>
            <td>6</td>
            <td>ss 3</td>
            <td>female</td>
            <td><input type="checkbox"></td>
            <td><input type="checkbox"></td>
        </tr>
    </table>

    <button onclick="window.print()">Print Register</button>
</div>
